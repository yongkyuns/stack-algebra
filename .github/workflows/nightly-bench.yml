name: Nightly benchmark comparison

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=native"
  STACK_ALGEBRA_BENCH_FAST: "1"

jobs:
  rust-bench:
    name: Rust ${{ matrix.bench }} benchmark
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bench: [comparison, dense_solvers, dense_multi_rhs, sparse, block_sparse, fixed_size, small_fixed, fused]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install Eigen for the isolated harness
        if: ${{ matrix.bench == 'dense_solvers' || matrix.bench == 'sparse' }}
        run: sudo apt-get update && sudo apt-get install --yes libeigen3-dev
      - name: Capture measurement provenance
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            source_dirty=true
          else
            source_dirty=false
          fi
          mkdir -p benchmark-provenance
          cpu="$(lscpu 2>/dev/null | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}')"
          {
            printf 'kind=rust\n'
            printf 'benchmark=%s\n' "${{ matrix.bench }}"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF_NAME"
            printf 'runner=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'cpu=%s\n' "${cpu:-unknown}"
            printf 'kernel=%s\n' "$(uname -sr)"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'cargo=%s\n' "$(cargo --version)"
            printf 'rustflags=%s\n' "$RUSTFLAGS"
            printf 'source_git_dirty=%s\n' "$source_dirty"
          } > "benchmark-provenance/rust-${{ matrix.bench }}.txt"
      - name: Run benchmark
        env:
          EIGEN3_INCLUDE_DIR: /usr/include/eigen3
        run: |
          if [ "${{ matrix.bench }}" = comparison ]; then
            cargo bench --bench comparison -- \
              --warm-up-time 0.02 --measurement-time 0.02 --sample-size 10 --noplot
          elif [ "${{ matrix.bench }}" = dense_solvers ] || [ "${{ matrix.bench }}" = sparse ]; then
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
              cargo bench --manifest-path tools/eigen-harness/Cargo.toml --bench "${{ matrix.bench }}" -- \
              --warm-up-time 0.02 --measurement-time 0.02 --sample-size 10 --noplot
          else
            cargo bench --all-features --bench "${{ matrix.bench }}" -- \
              --warm-up-time 0.02 --measurement-time 0.02 --sample-size 10 --noplot
          fi
      - name: Upload Criterion measurements
        uses: actions/upload-artifact@v4
        with:
          name: nightly-criterion-${{ matrix.bench }}
          path: target/criterion
          if-no-files-found: error
      - name: Upload Rust measurement provenance
        uses: actions/upload-artifact@v4
        with:
          name: nightly-provenance-rust-${{ matrix.bench }}
          path: benchmark-provenance/rust-${{ matrix.bench }}.txt
          if-no-files-found: error

  eigen-bench:
    name: Native Eigen benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install --yes libeigen3-dev
      - name: Capture measurement provenance
        shell: bash
        run: |
          set -euo pipefail
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            source_dirty=true
          else
            source_dirty=false
          fi
          mkdir -p benchmark-provenance
          cpu="$(lscpu 2>/dev/null | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}')"
          {
            printf 'kind=eigen\n'
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF_NAME"
            printf 'runner=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'cpu=%s\n' "${cpu:-unknown}"
            printf 'kernel=%s\n' "$(uname -sr)"
            printf 'cxx=%s\n' "$(c++ --version | head -n 1)"
            printf 'cxxflags=-march=native\n'
            printf 'source_git_dirty=%s\n' "$source_dirty"
          } > benchmark-provenance/eigen.txt
      - name: Run native Eigen benchmark
        run: |
          mkdir -p benchmark-input/eigen
          CXXFLAGS="-march=native" EIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            EIGEN_BENCH_SAMPLES=5 EIGEN_BENCH_MIN_SAMPLE_MS=5 \
            EIGEN_BENCH_CSV=benchmark-input/eigen/eigen-f32.csv \
            ./tools/eigen-harness/eigen/run_native_bench.sh f32 > benchmark-input/eigen/eigen-f32.txt
          CXXFLAGS="-march=native" EIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            EIGEN_BENCH_SAMPLES=5 EIGEN_BENCH_MIN_SAMPLE_MS=5 \
            EIGEN_BENCH_SKIP_BUILD=1 \
            EIGEN_BENCH_CSV=benchmark-input/eigen/eigen-f64.csv \
            ./tools/eigen-harness/eigen/run_native_bench.sh f64 > benchmark-input/eigen/eigen-f64.txt
      - name: Upload Eigen measurements
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eigen
          path: benchmark-input/eigen
          if-no-files-found: error
      - name: Upload Eigen measurement provenance
        uses: actions/upload-artifact@v4
        with:
          name: nightly-provenance-eigen
          path: benchmark-provenance/eigen.txt
          if-no-files-found: error

  report:
    name: Generate benchmark report
    needs: [rust-bench, eigen-bench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Capture source cleanliness before generated inputs
        shell: bash
        run: |
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            echo "SOURCE_GIT_DIRTY=true" >> "$GITHUB_ENV"
          else
            echo "SOURCE_GIT_DIRTY=false" >> "$GITHUB_ENV"
          fi
      - name: Download Criterion measurements
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-criterion-*
          path: benchmark-input/criterion
          merge-multiple: true
      - name: Download Eigen measurements
        uses: actions/download-artifact@v4
        with:
          name: nightly-eigen
          path: benchmark-input/eigen
      - name: Download measurement provenance
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-provenance-*
          path: benchmark-input/provenance
          merge-multiple: true
      - name: Capture benchmark provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-report
          cpu="$(lscpu 2>/dev/null | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}')"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF_NAME"
            printf 'git_dirty=%s\n' "${SOURCE_GIT_DIRTY:-unknown}"
            printf 'provenance_scope=source checkout captured before artifact downloads; measurement workers listed below\n'
            printf 'report_runner=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'report_cpu=%s\n' "${cpu:-unknown}"
            printf 'report_kernel=%s\n' "$(uname -sr)"
            printf 'report_rustc=%s\n' "$(rustc --version 2>/dev/null || echo unavailable)"
            printf 'report_cargo=%s\n' "$(cargo --version 2>/dev/null || echo unavailable)"
            printf '\n[measurement-workers]\n'
            for file in $(find benchmark-input/provenance -type f -name '*.txt' | sort); do
              printf '\n--- %s ---\n' "$(basename "$file")"
              cat "$file"
            done
          } > benchmark-report/provenance.txt
      - name: Generate report
        env:
          REPORT_SHA: ${{ github.sha }}
          REPORT_REF: ${{ github.ref_name }}
        run: >-
          python3 scripts/generate_benchmark_report.py
          --criterion-dir benchmark-input/criterion
          --eigen-csv benchmark-input/eigen/eigen-f32.csv
          --eigen-csv benchmark-input/eigen/eigen-f64.csv
          --output benchmark-report/index.html
          --csv-output benchmark-report/results.csv
          --metadata-file benchmark-report/provenance.txt
          --metadata "commit=${REPORT_SHA}; ref=${REPORT_REF}"
          --require-eigen
      - name: Upload nightly report artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-report
          path: benchmark-report
          if-no-files-found: error
