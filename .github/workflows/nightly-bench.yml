name: Nightly benchmark comparison

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-cpu=native"
  STACK_ALGEBRA_BENCH_FAST: "1"

jobs:
  rust-bench:
    name: Rust ${{ matrix.bench }} benchmark
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bench: [comparison, dense_solvers, sparse, block_sparse, fixed_size, small_fixed, fused]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install --yes libeigen3-dev
      - name: Run benchmark
        env:
          EIGEN3_INCLUDE_DIR: /usr/include/eigen3
        run: |
          if [ "${{ matrix.bench }}" = comparison ]; then
            cargo bench --bench comparison -- \
              --warm-up-time 0.02 --measurement-time 0.02 --sample-size 10 --noplot
          else
            cargo bench --all-features --bench "${{ matrix.bench }}" -- \
              --warm-up-time 0.02 --measurement-time 0.02 --sample-size 10 --noplot
          fi
      - name: Upload Criterion measurements
        uses: actions/upload-artifact@v4
        with:
          name: nightly-criterion-${{ matrix.bench }}
          path: target/criterion
          if-no-files-found: error

  eigen-bench:
    name: Native Eigen benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install --yes libeigen3-dev
      - name: Run native Eigen benchmark
        run: |
          mkdir -p benchmark-input/eigen
          CXXFLAGS="-march=native" EIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            EIGEN_BENCH_SAMPLES=5 EIGEN_BENCH_MIN_SAMPLE_MS=5 \
            EIGEN_BENCH_CSV=benchmark-input/eigen/eigen-f32.csv \
            ./eigen/run_native_bench.sh f32 > benchmark-input/eigen/eigen-f32.txt
          CXXFLAGS="-march=native" EIGEN3_INCLUDE_DIR=/usr/include/eigen3 \
            EIGEN_BENCH_SAMPLES=5 EIGEN_BENCH_MIN_SAMPLE_MS=5 \
            EIGEN_BENCH_SKIP_BUILD=1 \
            EIGEN_BENCH_CSV=benchmark-input/eigen/eigen-f64.csv \
            ./eigen/run_native_bench.sh f64 > benchmark-input/eigen/eigen-f64.txt
      - name: Upload Eigen measurements
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eigen
          path: benchmark-input/eigen
          if-no-files-found: error

  report:
    name: Generate benchmark report
    needs: [rust-bench, eigen-bench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Capture source cleanliness
        run: |
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            echo "SOURCE_GIT_DIRTY=true" >> "$GITHUB_ENV"
          else
            echo "SOURCE_GIT_DIRTY=false" >> "$GITHUB_ENV"
          fi
      - name: Download Criterion measurements
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-criterion-*
          path: benchmark-input/criterion
          merge-multiple: true
      - name: Download Eigen measurements
        uses: actions/download-artifact@v4
        with:
          name: nightly-eigen
          path: benchmark-input/eigen
      - name: Capture benchmark provenance
        run: |
          mkdir -p benchmark-report
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF_NAME"
            printf 'runner=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            cpu="$(lscpu 2>/dev/null | awk -F: '/Model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}')"
            printf 'cpu=%s\n' "${cpu:-unknown}"
            printf 'kernel=%s\n' "$(uname -sr)"
            printf 'rustc=%s\n' "$(rustc --version 2>/dev/null || echo unavailable)"
            printf 'cargo=%s\n' "$(cargo --version 2>/dev/null || echo unavailable)"
            printf 'git_dirty=%s\n' "${SOURCE_GIT_DIRTY:-unknown}"
          } > benchmark-report/provenance.txt
      - name: Generate report
        env:
          REPORT_SHA: ${{ github.sha }}
          REPORT_REF: ${{ github.ref_name }}
        run: >-
          python3 scripts/generate_benchmark_report.py
          --criterion-dir benchmark-input/criterion
          --eigen-csv benchmark-input/eigen/eigen-f32.csv
          --eigen-csv benchmark-input/eigen/eigen-f64.csv
          --output benchmark-report/index.html
          --csv-output benchmark-report/results.csv
          --metadata-file benchmark-report/provenance.txt
          --metadata "commit=${REPORT_SHA}; ref=${REPORT_REF}; runner=${RUNNER_OS}/${RUNNER_ARCH}"
          --require-eigen
      - name: Upload nightly report artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-report
          path: benchmark-report
          if-no-files-found: error
