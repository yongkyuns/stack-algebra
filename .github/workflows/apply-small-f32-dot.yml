name: Apply small f32 dot optimization

on:
  push:
    branches:
      - agent/small-f32-dot-avx2
    paths:
      - .github/workflows/apply-small-f32-dot.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/small-f32-dot-avx2
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply kernel change and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/kernels/x86/avx2_fma.rs")
          text = path.read_text()
          start_marker = '#[target_feature(enable = "avx2,fma")]\nunsafe fn reduction_dot_f32'
          end_marker = '#[target_feature(enable = "avx2,fma")]\nunsafe fn reduction_dot_f64'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''#[target_feature(enable = "avx2,fma")]
          unsafe fn reduction_dot_f32<const M: usize>(lhs: &Vector<M, f32>, rhs: &Vector<M, f32>) -> f32 {
              use core::arch::x86_64::{
                  _mm_add_ps, _mm_add_ss, _mm_cvtss_f32, _mm_loadu_ps, _mm_movehl_ps, _mm_mul_ps,
                  _mm_shuffle_ps, _mm256_add_ps, _mm256_castps256_ps128, _mm256_extractf128_ps,
                  _mm256_fmadd_ps, _mm256_loadu_ps, _mm256_setzero_ps,
              };

              macro_rules! horizontal_sum4 {
                  ($value:expr) => {{
                      let value = $value;
                      let pair_sums = _mm_add_ps(value, _mm_movehl_ps(value, value));
                      let upper_pair = _mm_shuffle_ps::<0x55>(pair_sums, pair_sums);
                      _mm_cvtss_f32(_mm_add_ss(pair_sums, upper_pair))
                  }};
              }

              macro_rules! horizontal_sum8 {
                  ($value:expr) => {{
                      let value = $value;
                      let halves = _mm_add_ps(
                          _mm256_castps256_ps128(value),
                          _mm256_extractf128_ps::<1>(value),
                      );
                      horizontal_sum4!(halves)
                  }};
              }

              if M < 4 {
                  let mut result = 0.0_f32;
                  let mut index = 0;
                  while index < M {
                      result += lhs[index] * rhs[index];
                      index += 1;
                  }
                  return result;
              }

              let lhs_values = lhs.as_slice();
              let rhs_values = rhs.as_slice();
              if M < 8 {
                  let product = _mm_mul_ps(
                      _mm_loadu_ps(lhs_values.as_ptr()),
                      _mm_loadu_ps(rhs_values.as_ptr()),
                  );
                  let mut result = horizontal_sum4!(product);
                  let mut index = 4;
                  while index < M {
                      result += lhs_values[index] * rhs_values[index];
                      index += 1;
                  }
                  return result;
              }

              if M < 32 {
                  let mut accumulator0 = _mm256_setzero_ps();
                  let mut accumulator1 = _mm256_setzero_ps();
                  let mut index = 0;
                  while index + 16 <= M {
                      accumulator0 = _mm256_fmadd_ps(
                          _mm256_loadu_ps(lhs_values.as_ptr().add(index)),
                          _mm256_loadu_ps(rhs_values.as_ptr().add(index)),
                          accumulator0,
                      );
                      accumulator1 = _mm256_fmadd_ps(
                          _mm256_loadu_ps(lhs_values.as_ptr().add(index + 8)),
                          _mm256_loadu_ps(rhs_values.as_ptr().add(index + 8)),
                          accumulator1,
                      );
                      index += 16;
                  }
                  while index + 8 <= M {
                      accumulator0 = _mm256_fmadd_ps(
                          _mm256_loadu_ps(lhs_values.as_ptr().add(index)),
                          _mm256_loadu_ps(rhs_values.as_ptr().add(index)),
                          accumulator0,
                      );
                      index += 8;
                  }
                  let mut result = horizontal_sum8!(_mm256_add_ps(accumulator0, accumulator1));
                  if index + 4 <= M {
                      let product = _mm_mul_ps(
                          _mm_loadu_ps(lhs_values.as_ptr().add(index)),
                          _mm_loadu_ps(rhs_values.as_ptr().add(index)),
                      );
                      result += horizontal_sum4!(product);
                      index += 4;
                  }
                  while index < M {
                      result += lhs_values[index] * rhs_values[index];
                      index += 1;
                  }
                  return result;
              }

              let mut accumulator0 = _mm256_setzero_ps();
              let mut accumulator1 = _mm256_setzero_ps();
              let mut accumulator2 = _mm256_setzero_ps();
              let mut accumulator3 = _mm256_setzero_ps();
              let mut index = 0;
              while index + 32 <= M {
                  accumulator0 = _mm256_fmadd_ps(
                      _mm256_loadu_ps(lhs_values.as_ptr().add(index)),
                      _mm256_loadu_ps(rhs_values.as_ptr().add(index)),
                      accumulator0,
                  );
                  accumulator1 = _mm256_fmadd_ps(
                      _mm256_loadu_ps(lhs_values.as_ptr().add(index + 8)),
                      _mm256_loadu_ps(rhs_values.as_ptr().add(index + 8)),
                      accumulator1,
                  );
                  accumulator2 = _mm256_fmadd_ps(
                      _mm256_loadu_ps(lhs_values.as_ptr().add(index + 16)),
                      _mm256_loadu_ps(rhs_values.as_ptr().add(index + 16)),
                      accumulator2,
                  );
                  accumulator3 = _mm256_fmadd_ps(
                      _mm256_loadu_ps(lhs_values.as_ptr().add(index + 24)),
                      _mm256_loadu_ps(rhs_values.as_ptr().add(index + 24)),
                      accumulator3,
                  );
                  index += 32;
              }
              while index + 8 <= M {
                  accumulator0 = _mm256_fmadd_ps(
                      _mm256_loadu_ps(lhs_values.as_ptr().add(index)),
                      _mm256_loadu_ps(rhs_values.as_ptr().add(index)),
                      accumulator0,
                  );
                  index += 8;
              }

              accumulator0 = _mm256_add_ps(accumulator0, accumulator1);
              accumulator2 = _mm256_add_ps(accumulator2, accumulator3);
              accumulator0 = _mm256_add_ps(accumulator0, accumulator2);
              let mut result = horizontal_sum8!(accumulator0);
              if index + 4 <= M {
                  let product = _mm_mul_ps(
                      _mm_loadu_ps(lhs_values.as_ptr().add(index)),
                      _mm_loadu_ps(rhs_values.as_ptr().add(index)),
                  );
                  result += horizontal_sum4!(product);
                  index += 4;
              }
              while index < M {
                  result += lhs_values[index] * rhs_values[index];
                  index += 1;
              }
              result
          }

          #[cfg(test)]
          mod f32_dot_tests {
              use crate::Vector;

              fn scalar_dot<const M: usize>(lhs: &Vector<M, f32>, rhs: &Vector<M, f32>) -> f32 {
                  let mut result = 0.0_f32;
                  let mut index = 0;
                  while index < M {
                      result += lhs[index] * rhs[index];
                      index += 1;
                  }
                  result
              }

              fn check<const M: usize>() {
                  let lhs = Vector::<M, f32>::from_fn(|row, _| ((row % 7) as f32 - 3.0) / 7.0);
                  let rhs = Vector::<M, f32>::from_fn(|row, _| ((2 * row % 11) as f32 - 5.0) / 9.0);
                  let expected = scalar_dot(&lhs, &rhs);
                  let actual = lhs.dot(&rhs);
                  let tolerance = 8.0 * f32::EPSILON * (M as f32) * expected.abs().max(1.0);
                  assert!(
                      (actual - expected).abs() <= tolerance,
                      "M={M}: expected {expected}, got {actual}, tolerance {tolerance}"
                  );
              }

              #[test]
              fn dot_matches_scalar_around_packet_boundaries() {
                  check::<1>();
                  check::<2>();
                  check::<3>();
                  check::<4>();
                  check::<5>();
                  check::<6>();
                  check::<7>();
                  check::<8>();
                  check::<9>();
                  check::<15>();
                  check::<16>();
                  check::<17>();
                  check::<31>();
                  check::<32>();
                  check::<33>();
              }

              #[test]
              fn dot_preserves_non_finite_classification() {
                  let ones = Vector::<8, f32>::from_fn(|_, _| 1.0);
                  let mut infinity = ones;
                  infinity[5] = f32::INFINITY;
                  assert_eq!(infinity.dot(&ones), f32::INFINITY);

                  let mut nan = ones;
                  nan[2] = f32::NAN;
                  assert!(nan.dot(&ones).is_nan());
              }
          }

          '''

          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt --all

      - name: Verify AVX2/FMA correctness and lint
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=native
        run: |
          grep -m1 -q '\bavx2\b' /proc/cpuinfo
          grep -m1 -q '\bfma\b' /proc/cpuinfo
          cargo test --lib f32_dot_tests
          cargo clippy --lib -- -D warnings
          git diff --check

      - name: Compare focused dot benchmarks with base
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=native
          STACK_ALGEBRA_BENCH_FAST: "1"
        run: |
          cp src/kernels/x86/avx2_fma.rs /tmp/issue10-candidate.rs
          git show 4c7fd5291da02c80460aeca363ff3b1c6426b27b:src/kernels/x86/avx2_fma.rs > src/kernels/x86/avx2_fma.rs
          cargo bench --bench comparison -- 'comparison/dot/f32' --save-baseline issue10-base
          cp /tmp/issue10-candidate.rs src/kernels/x86/avx2_fma.rs
          cargo bench --bench comparison -- 'comparison/dot/f32' --baseline issue10-base
          cargo fmt --all -- --check

      - name: Commit production change only
        shell: bash
        run: |
          rm .github/workflows/apply-small-f32-dot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/kernels/x86/avx2_fma.rs .github/workflows/apply-small-f32-dot.yml
          git diff --cached --check
          git commit -m "perf: optimize small f32 AVX2 dot reduction"
          git push origin HEAD:agent/small-f32-dot-avx2
