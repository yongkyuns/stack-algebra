name: Cholesky threshold summary

on:
  push:
    branches:
      - agent/cholesky-blocked-threshold
    paths:
      - .github/workflows/cholesky-threshold-summary.yml

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cholesky-blocked-threshold
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare focused Cholesky benchmark
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('benches/comparison.rs')
          text = path.read_text()
          marker = '            pub fn run(c: &mut Criterion) {'
          start = text.index(marker)
          brace = text.index('{', start)
          depth = 0
          for index in range(brace, len(text)):
              if text[index] == '{':
                  depth += 1
              elif text[index] == '}':
                  depth -= 1
                  if depth == 0:
                      end = index + 1
                      break
          replacement = '''            pub fn run(c: &mut Criterion) {
                llt::<15>(c);
                llt::<16>(c);
                llt::<24>(c);
                llt::<32>(c);
                llt::<48>(c);
                llt::<64>(c);
            }'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Measure thresholds and capture concise output
        env:
          RUSTFLAGS: -C target-cpu=native
          STACK_ALGEBRA_BENCH_FAST: '1'
        run: |
          cp src/algebra/cholesky.rs /tmp/cholesky.rs
          printf '# Cholesky threshold sweep\n\nSame hosted runner; Rust stable; `-C target-cpu=native`; Criterion fast mode.\n\n' > cholesky-threshold-summary.txt

          measure () {
            label="$1"
            threshold="$2"
            cp /tmp/cholesky.rs src/algebra/cholesky.rs
            THRESHOLD="$threshold" python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('src/algebra/cholesky.rs')
          text = path.read_text()
          old = 'const BLOCKED_THRESHOLD: usize = 64;'
          count = text.count(old)
          assert count == 2, count
          path.write_text(text.replace(old, f"const BLOCKED_THRESHOLD: usize = {os.environ['THRESHOLD']};"))
          PY
            printf '\n===== threshold=%s =====\n' "$label" >> cholesky-threshold-summary.txt
            if [ "$label" = 64 ]; then
              cargo bench --bench comparison -- 'comparison/llt-factor/(f32|f64)/stack-algebra' --save-baseline cholesky-64 2>&1 | tee /tmp/cholesky-run.log
            else
              cargo bench --bench comparison -- 'comparison/llt-factor/(f32|f64)/stack-algebra' --baseline cholesky-64 2>&1 | tee /tmp/cholesky-run.log
            fi
            python3 - <<'PY'
          import re
          from pathlib import Path
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          text = ansi.sub('', Path('/tmp/cholesky-run.log').read_text(errors='replace'))
          keep = []
          active = False
          for line in text.splitlines():
              if 'comparison/llt-factor/' in line and '/stack-algebra/' in line:
                  active = True
                  keep.append(line.strip())
              elif active and any(token in line for token in ('time:', 'change:', 'Performance has ', 'No change in performance detected.')):
                  keep.append(line.strip())
              elif active and line.strip() == '':
                  active = False
          with Path('cholesky-threshold-summary.txt').open('a') as f:
              for line in keep:
                  f.write(line + '\n')
          PY
          }

          measure 64 64
          measure 48 48
          measure 32 32
          measure 24 24
          measure 16 16
          measure 64-repeat 64

      - name: Restore source and publish summary
        if: always()
        run: |
          git checkout -- src/algebra/cholesky.rs benches/comparison.rs
          touch cholesky-threshold-summary.txt
          rm -f .github/workflows/cholesky-threshold-summary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/cholesky-threshold-summary.yml cholesky-threshold-summary.txt
          git commit -m 'chore: record Cholesky threshold sweep summary'
          git push origin HEAD:agent/cholesky-blocked-threshold
