name: Verify small f32 dot repeatability

on:
  push:
    branches:
      - agent/small-f32-dot-avx2
    paths:
      - .github/workflows/verify-small-f32-dot.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/small-f32-dot-avx2
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Recheck focused correctness
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=native
        run: |
          grep -m1 -q '\bavx2\b' /proc/cpuinfo
          grep -m1 -q '\bfma\b' /proc/cpuinfo
          cargo test --lib f32_dot_tests
          cargo fmt --all -- --check

      - name: Repeat hosted dot comparison
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=native
          STACK_ALGEBRA_BENCH_FAST: "1"
        run: |
          cp src/kernels/x86/avx2_fma.rs /tmp/issue10-candidate.rs
          git show 4c7fd5291da02c80460aeca363ff3b1c6426b27b:src/kernels/x86/avx2_fma.rs > src/kernels/x86/avx2_fma.rs
          cargo bench --bench comparison -- 'comparison/dot/f' --save-baseline issue10-second-base
          cp /tmp/issue10-candidate.rs src/kernels/x86/avx2_fma.rs
          cargo bench --bench comparison -- 'comparison/dot/f' --baseline issue10-second-base
          cargo fmt --all -- --check

      - name: Restore CI and remove helper
        shell: bash
        run: |
          git checkout 4c7fd5291da02c80460aeca363ff3b1c6426b27b -- .github/workflows/ci.yml
          rm .github/workflows/verify-small-f32-dot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/verify-small-f32-dot.yml
          git diff --cached --check
          git commit -m "chore: finalize small f32 dot optimization"
          git push origin HEAD:agent/small-f32-dot-avx2
