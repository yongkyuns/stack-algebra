name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
      - run: cargo check --no-default-features
      - name: Verify ordinary consumers exclude Eigen build tooling
        run: sh scripts/check_core_dependency_boundary.sh
      - name: Run representative examples
        run: |
          cargo run --example ekf_measurement_update --no-default-features
          cargo run --example mapped_least_squares --no-default-features
          cargo run --example embedded_resource_budget --no-default-features
      - name: Check benchmark script syntax
        run: |
          sh -n scripts/run_release_benchmarks.sh
          bash -n tools/eigen-harness/eigen/run_native_bench.sh

  x86-kernels:
    name: x86 kernel correctness (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sse2
            rustflags: "-C target-feature=-avx2,-fma"
            requires_avx2: false
            requires_fma: false
          - name: avx2
            rustflags: "-C target-feature=+avx2,-fma"
            requires_avx2: true
            requires_fma: false
          - name: avx2-fma
            rustflags: "-C target-feature=+avx2,+fma"
            requires_avx2: true
            requires_fma: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify runner exposes required ISA
        if: ${{ matrix.requires_avx2 }}
        shell: bash
        run: |
          set -euo pipefail
          grep -qw avx2 /proc/cpuinfo
          if [[ "${{ matrix.requires_fma }}" == "true" ]]; then
            grep -qw fma /proc/cpuinfo
          fi
      - name: Run library and integration tests through selected backend
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --no-default-features --lib --tests
      - name: Check safe scalar hooks with release assertions
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --release --no-default-features --test scalar_hook_contracts

  msrv:
    name: MSRV 1.87
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - run: cargo check --lib --no-default-features
      - run: cargo check --lib --features std

  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --no-default-features --lib --tests
      - name: Check matrix storage contracts in release mode
        run: cargo test --release --no-default-features --test matrix_storage

  eigen-oracle:
    name: Eigen oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --yes libeigen3-dev
      - name: Run isolated Eigen parity harness
        env:
          EIGEN3_INCLUDE_DIR: /usr/include/eigen3
        run: cargo test --manifest-path tools/eigen-harness/Cargo.toml
      - name: Compile isolated Eigen-linked Criterion benchmarks
        env:
          EIGEN3_INCLUDE_DIR: /usr/include/eigen3
        run: >-
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo bench --manifest-path tools/eigen-harness/Cargo.toml
          --benches --no-run
      - name: Compile native Eigen benchmark
        run: >-
          c++ -std=c++17 -O0 -I/usr/include/eigen3
          tools/eigen-harness/eigen/native_bench.cpp
          -o /tmp/stack-algebra-eigen-native-bench

  embedded:
    name: Embedded targets, QEMU, and resources
    runs-on: ubuntu-latest
    env:
      STACK_USAGE_LIMIT_BYTES: 8192
      QUALIFICATION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-unknown-none,thumbv6m-none-eabi,thumbv7em-none-eabihf,riscv32imc-unknown-none-elf,wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install --yes qemu-system-arm qemu-system-misc
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-binutils --locked
      - run: cargo check --target thumbv6m-none-eabi --no-default-features
      - run: cargo check --target thumbv7em-none-eabihf --no-default-features
      - run: cargo check --target riscv32imc-unknown-none-elf --no-default-features
      - run: cargo check --target aarch64-unknown-none --no-default-features
      - run: cargo check --target wasm32-unknown-unknown --no-default-features
      - run: qemu-tests/run_cortex_m.sh
      - run: qemu-tests/run_riscv32.sh
      - run: qemu-tests/run_aarch64.sh
      - name: Generate Cortex-M resource report and enforce budgets
        run: qemu-tests/qualify_cortex_m.sh
      - name: Check real-hardware benchmark harness builds
        run: >-
          RUSTFLAGS="-C link-arg=-Tlink.x"
          cargo build --manifest-path qemu-tests/Cargo.toml
          --target thumbv7em-none-eabihf --release --features cortex-m
          --bin cortex-m-bench
      - name: Add resource report to job summary
        run: |
          printf '### Cortex-M resource provenance\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat qemu-tests/resource-provenance.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n\n### Cortex-M resource report\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat qemu-tests/resource-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Cortex-M resource report
        uses: actions/upload-artifact@v4
        with:
          name: cortex-m-resource-report
          path: |
            qemu-tests/resource-provenance.txt
            qemu-tests/resource-report.tsv
            qemu-tests/resource-report.md
          if-no-files-found: error

  arm64:
    name: Native ARM64 tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --no-default-features --lib --tests
      - run: cargo test --no-default-features --doc

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path qemu-tests/Cargo.toml -- --check
      - run: cargo fmt --manifest-path tools/eigen-harness/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Lint library, tests, examples, and benchmarks
        run: cargo clippy --all-targets -- -D warnings
      - name: Lint std library configuration
        run: cargo clippy --lib --features std -- -D warnings

  miri:
    name: Miri view and sparse safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: >-
          cargo miri test --no-default-features
          --test matrix_storage
          --test scalar_hook_contracts
          --test view_ops
          --test fused_view_paths
          --test sparse
          --test sparse_cholesky
          --test sparse_ldlt
          -- --test-threads=1
