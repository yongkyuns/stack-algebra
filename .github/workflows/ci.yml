on: [push, pull_request]

name: Build

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
      - run: cargo check --no-default-features
      - name: Test SSE2 backend without AVX2
        run: RUSTFLAGS="-C target-feature=-avx2,-fma" cargo test --lib

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --yes libeigen3-dev
      - run: EIGEN3_INCLUDE_DIR=/usr/include/eigen3 cargo test --features eigen-compare
      - run: cargo test --no-default-features --lib --tests

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install --yes libeigen3-dev
      - run: EIGEN3_INCLUDE_DIR=/usr/include/eigen3 cargo test --doc --all-features
      - run: EIGEN3_INCLUDE_DIR=/usr/include/eigen3 cargo doc --no-deps --all-features

  embedded:
    name: Embedded targets, QEMU, and resources
    runs-on: ubuntu-latest
    env:
      STACK_USAGE_LIMIT_BYTES: 8192
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none,thumbv6m-none-eabi,thumbv7em-none-eabihf,riscv32imc-unknown-none-elf,wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install --yes qemu-system-arm qemu-system-misc
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-binutils --locked
      - run: cargo check --target thumbv6m-none-eabi --no-default-features
      - run: cargo check --target thumbv7em-none-eabihf --no-default-features
      - run: cargo check --target riscv32imc-unknown-none-elf --no-default-features
      - run: cargo check --target aarch64-unknown-none --no-default-features
      - run: cargo check --target wasm32-unknown-unknown --no-default-features
      - run: qemu-tests/run_cortex_m.sh
      - run: qemu-tests/run_riscv32.sh
      - run: qemu-tests/run_aarch64.sh
      - name: Generate Cortex-M resource report
        run: qemu-tests/qualify_cortex_m.sh
      - name: Check real-hardware benchmark harness builds
        run: >-
          RUSTFLAGS="-C link-arg=-Tlink.x"
          cargo build --manifest-path qemu-tests/Cargo.toml
          --target thumbv7em-none-eabihf --release --features cortex-m
          --bin cortex-m-bench
      - name: Add resource report to job summary
        run: cat qemu-tests/resource-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Cortex-M resource report
        uses: actions/upload-artifact@v4
        with:
          name: cortex-m-resource-report
          path: |
            qemu-tests/resource-report.tsv
            qemu-tests/resource-report.md
          if-no-files-found: error

  arm64:
    name: Native ARM64 tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --no-default-features --lib --tests
      - run: cargo test --no-default-features --doc

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path qemu-tests/Cargo.toml -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy -- -D warnings

  miri:
    name: Miri view and sparse safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri setup
      - run: >-
          cargo miri test --no-default-features
          --test view_ops
          --test fused_view_paths
          --test sparse
          --test sparse_cholesky
          --test sparse_ldlt
          -- --test-threads=1
