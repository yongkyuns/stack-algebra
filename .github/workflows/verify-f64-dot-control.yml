name: Verify f64 dot control

on:
  push:
    branches:
      - agent/small-f32-dot-avx2
    paths:
      - .github/workflows/verify-f64-dot-control.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/small-f32-dot-avx2
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Base to candidate control
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=native
          STACK_ALGEBRA_BENCH_FAST: "1"
        run: |
          grep -m1 -q '\bavx2\b' /proc/cpuinfo
          grep -m1 -q '\bfma\b' /proc/cpuinfo
          cp src/kernels/x86/avx2_fma.rs /tmp/issue10-candidate.rs
          git show 4c7fd5291da02c80460aeca363ff3b1c6426b27b:src/kernels/x86/avx2_fma.rs > src/kernels/x86/avx2_fma.rs
          cargo bench --bench comparison -- 'comparison/dot/f64/stack-algebra/32' --save-baseline issue10-f64-base
          cp /tmp/issue10-candidate.rs src/kernels/x86/avx2_fma.rs
          cargo bench --bench comparison -- 'comparison/dot/f64/stack-algebra/32' --baseline issue10-f64-base

      - name: Candidate to base control
        shell: bash
        env:
          RUSTFLAGS: -C target-cpu=native
          STACK_ALGEBRA_BENCH_FAST: "1"
        run: |
          cargo bench --bench comparison -- 'comparison/dot/f64/stack-algebra/32' --save-baseline issue10-f64-candidate
          git show 4c7fd5291da02c80460aeca363ff3b1c6426b27b:src/kernels/x86/avx2_fma.rs > src/kernels/x86/avx2_fma.rs
          cargo bench --bench comparison -- 'comparison/dot/f64/stack-algebra/32' --baseline issue10-f64-candidate
          cp /tmp/issue10-candidate.rs src/kernels/x86/avx2_fma.rs
          cargo fmt --all -- --check

      - name: Remove helper
        shell: bash
        run: |
          rm .github/workflows/verify-f64-dot-control.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-f64-dot-control.yml
          git commit -m "chore: remove f64 dot control helper"
          git push origin HEAD:agent/small-f32-dot-avx2
