name: Dense multi-RHS benchmark check

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "benches/dense_multi_rhs.rs"
      - "benches/dense_multi_rhs_impl.rs"
      - ".github/workflows/dense-multi-rhs-bench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Compile, precheck, and sample multi-RHS solves
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C target-cpu=native"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run benchmark triage sweep
        run: >-
          cargo bench --bench dense_multi_rhs --
          --warm-up-time 0.01 --measurement-time 0.02 --sample-size 10 --noplot
      - name: Upload Criterion measurements
        uses: actions/upload-artifact@v4
        with:
          name: dense-multi-rhs-criterion
          path: target/criterion
          if-no-files-found: error
