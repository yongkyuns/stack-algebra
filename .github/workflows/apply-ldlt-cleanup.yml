name: Apply LDLT PR cleanup

on:
  push:
    branches:
      - agent/ldlt-multi-rhs-solve
    paths:
      - ".github/workflows/apply-ldlt-cleanup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ldlt-multi-rhs-solve
          fetch-depth: 0
      - name: Apply cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ldlt = Path("src/algebra/ldlt.rs")
          text = ldlt.read_text()
          old = '''                    let next_value = rhs[(next, column)];
                    rhs[(next, column)] = value;
                    value = next_value;
'''
          new = '''                    core::mem::swap(&mut rhs[(next, column)], &mut value);
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one manual swap, found {text.count(old)}")
          ldlt.write_text(text.replace(old, new, 1))

          cargo = Path("Cargo.toml")
          manifest = cargo.read_text()
          trigger = "# Temporary PR trigger for #9 scalar-fast-path performance sampling.\n"
          if manifest.count(trigger) != 1:
              raise SystemExit(f"expected exactly one benchmark trigger comment, found {manifest.count(trigger)}")
          cargo.write_text(manifest.replace(trigger, "", 1))

          Path(".github/workflows/apply-ldlt-cleanup.yml").unlink()
          PY
      - name: Format and verify focused checks
        run: |
          cargo fmt --all
          cargo clippy -- -D warnings
          cargo test --lib ldlt
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/algebra/ldlt.rs Cargo.toml .github/workflows/apply-ldlt-cleanup.yml
          git commit -m "chore: finalize LDLT multi-RHS optimization"
          git push origin HEAD:agent/ldlt-multi-rhs-solve
