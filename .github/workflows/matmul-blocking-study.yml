name: AVX2 matmul blocking study

on:
  push:
    branches:
      - agent/matmul-blocking-study
    paths:
      - .github/workflows/matmul-blocking-study.yml

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/matmul-blocking-study
      - uses: dtolnay/rust-toolchain@stable
      - name: Create focused matmul benchmark
        run: |
          cat > benches/matmul_blocking_study.rs <<'RS'
          use std::{hint::black_box, time::Duration};
          use criterion::{criterion_group, criterion_main, BenchmarkId, Criterion};
          use stack_algebra::{Matrix, MatrixScalar};

          fn dense<const D: usize, T>() -> Matrix<D, D, T>
          where
              T: MatrixScalar + num_traits::FromPrimitive,
          {
              Matrix::from_fn(|r, c| T::from_f64((1 + r * D + 2 * c) as f64 / 17.0).unwrap())
          }

          fn case<const D: usize, T>(c: &mut Criterion, scalar: &str)
          where
              T: MatrixScalar + num_traits::FromPrimitive,
          {
              let a = dense::<D, T>();
              let b = dense::<D, T>();
              let mut out = Matrix::<D, D, T>::zeros();
              let mut group = c.benchmark_group(format!("matmul-blocking/{scalar}"));
              group.bench_function(BenchmarkId::new("stack", D), |bench| {
                  bench.iter(|| black_box(&a).mul_into(black_box(&b), black_box(&mut out)))
              });
              group.finish();
          }

          fn run(c: &mut Criterion) {
              case::<15, f32>(c, "f32");
              case::<16, f32>(c, "f32");
              case::<20, f32>(c, "f32");
              case::<24, f32>(c, "f32");
              case::<28, f32>(c, "f32");
              case::<32, f32>(c, "f32");
              case::<40, f32>(c, "f32");
              case::<48, f32>(c, "f32");
              case::<15, f64>(c, "f64");
              case::<16, f64>(c, "f64");
              case::<20, f64>(c, "f64");
              case::<24, f64>(c, "f64");
              case::<28, f64>(c, "f64");
              case::<32, f64>(c, "f64");
              case::<40, f64>(c, "f64");
              case::<48, f64>(c, "f64");
          }

          fn config() -> Criterion {
              Criterion::default()
                  .warm_up_time(Duration::from_millis(30))
                  .measurement_time(Duration::from_millis(50))
                  .sample_size(12)
          }

          criterion_group! { name = benches; config = config(); targets = run }
          criterion_main!(benches);
          RS
          cat >> Cargo.toml <<'TOML'

          [[bench]]
          name = "matmul_blocking_study"
          harness = false
          TOML

      - name: Compare row-aligned blocking candidate
        env:
          RUSTFLAGS: -C target-cpu=native
        run: |
          cargo bench --bench matmul_blocking_study -- --noplot --save-baseline block-current

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/kernels/x86/avx2_fma.rs')
          text = path.read_text()
          old_eight = 'while P >= 8 && P % 8 <= 2 && column + 8 <= P {'
          assert text.count(old_eight) == 2

          f32_start = text.index('unsafe fn matmul_f32')
          f64_start = text.index('unsafe fn matmul_f64')
          f32 = text[f32_start:f64_start]
          f64 = text[f64_start:]

          f32 = f32.replace(
              old_eight,
              'while M % 16 != 0 && P >= 8 && P % 8 <= 2 && column + 8 <= P {',
              1,
          )
          f64 = f64.replace(
              old_eight,
              'while false && P >= 8 && P % 8 <= 2 && column + 8 <= P {',
              1,
          )

          four_start = f32.index('while column + 4 <= P {')
          row8 = f32.index('        while row + 8 <= M {', four_start)
          block16 = '''        while row + 16 <= M {
              let mut accumulator00 = _mm256_setzero_ps();
              let mut accumulator01 = _mm256_setzero_ps();
              let mut accumulator02 = _mm256_setzero_ps();
              let mut accumulator03 = _mm256_setzero_ps();
              let mut accumulator10 = _mm256_setzero_ps();
              let mut accumulator11 = _mm256_setzero_ps();
              let mut accumulator12 = _mm256_setzero_ps();
              let mut accumulator13 = _mm256_setzero_ps();
              for shared in 0..N {
                  let lhs_packet0 = _mm256_loadu_ps(lhs_values.as_ptr().add(shared * M + row));
                  let lhs_packet1 =
                      _mm256_loadu_ps(lhs_values.as_ptr().add(shared * M + row + 8));
                  let rhs0 = _mm256_set1_ps(*rhs_values.as_ptr().add(column * N + shared));
                  let rhs1 =
                      _mm256_set1_ps(*rhs_values.as_ptr().add((column + 1) * N + shared));
                  let rhs2 =
                      _mm256_set1_ps(*rhs_values.as_ptr().add((column + 2) * N + shared));
                  let rhs3 =
                      _mm256_set1_ps(*rhs_values.as_ptr().add((column + 3) * N + shared));
                  accumulator00 = _mm256_fmadd_ps(lhs_packet0, rhs0, accumulator00);
                  accumulator01 = _mm256_fmadd_ps(lhs_packet0, rhs1, accumulator01);
                  accumulator02 = _mm256_fmadd_ps(lhs_packet0, rhs2, accumulator02);
                  accumulator03 = _mm256_fmadd_ps(lhs_packet0, rhs3, accumulator03);
                  accumulator10 = _mm256_fmadd_ps(lhs_packet1, rhs0, accumulator10);
                  accumulator11 = _mm256_fmadd_ps(lhs_packet1, rhs1, accumulator11);
                  accumulator12 = _mm256_fmadd_ps(lhs_packet1, rhs2, accumulator12);
                  accumulator13 = _mm256_fmadd_ps(lhs_packet1, rhs3, accumulator13);
              }
              _mm256_storeu_ps(output_values.as_mut_ptr().add(column * M + row), accumulator00);
              _mm256_storeu_ps(output_values.as_mut_ptr().add((column + 1) * M + row), accumulator01);
              _mm256_storeu_ps(output_values.as_mut_ptr().add((column + 2) * M + row), accumulator02);
              _mm256_storeu_ps(output_values.as_mut_ptr().add((column + 3) * M + row), accumulator03);
              _mm256_storeu_ps(output_values.as_mut_ptr().add(column * M + row + 8), accumulator10);
              _mm256_storeu_ps(output_values.as_mut_ptr().add((column + 1) * M + row + 8), accumulator11);
              _mm256_storeu_ps(output_values.as_mut_ptr().add((column + 2) * M + row + 8), accumulator12);
              _mm256_storeu_ps(output_values.as_mut_ptr().add((column + 3) * M + row + 8), accumulator13);
              row += 16;
          }
          '''
          f32 = f32[:row8] + block16 + f32[row8:]
          path.write_text(text[:f32_start] + f32 + f64)
          PY

          cargo fmt -- src/kernels/x86/avx2_fma.rs
          cargo test --lib
          cargo bench --bench matmul_blocking_study -- --noplot --baseline block-current 2>&1 | tee /tmp/matmul-candidate.log

      - name: Print comparison lines
        if: always()
        run: grep -E 'matmul-blocking|time:|change:|Performance has|No change' /tmp/matmul-candidate.log || true

      - name: Restore source
        if: always()
        run: git checkout -- src/kernels/x86/avx2_fma.rs Cargo.toml && rm -f benches/matmul_blocking_study.rs
