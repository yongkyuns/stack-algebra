name: Triangular solve benchmark

on:
  push:
    branches:
      - agent/triangular-multi-rhs-solve
    paths:
      - .github/workflows/triangular-solve-bench.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/triangular-multi-rhs-solve
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate focused tests
        run: cargo test --lib algebra::triangular::tests
      - name: Compare main to candidate
        env:
          RUSTFLAGS: -C target-cpu=native
        run: |
          candidate="$(git rev-parse HEAD)"
          filter='dense-multi-rhs/triangular/(f32|f64)/stack-(lower|upper)/(15|16|32)x(1|2|4)'
          git checkout 5fb2755e902da16873252cb7017c23c74364f3b8
          cargo bench --bench dense_multi_rhs -- "$filter" \
            --warm-up-time 0.02 --measurement-time 0.03 --sample-size 10 --noplot \
            --save-baseline triangular-main
          git checkout "$candidate"
          cargo bench --bench dense_multi_rhs -- "$filter" \
            --warm-up-time 0.02 --measurement-time 0.03 --sample-size 10 --noplot \
            --baseline triangular-main 2>&1 | tee /tmp/triangular-candidate.log
      - name: Print comparison lines
        if: always()
        run: |
          grep -E 'dense-multi-rhs/triangular|time:|change:|Performance has|No change' /tmp/triangular-candidate.log || true
