name: Apply isolated AVX2 matmul candidate

on:
  push:
    branches:
      - agent/avx2-matmul-blocking
    paths:
      - .github/workflows/apply-avx2-matmul-policy.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/avx2-matmul-blocking
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply packet-aware blocking policy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/kernels/x86/avx2_fma.rs')
          text = path.read_text()
          old_eight = 'while P >= 8 && P % 8 <= 2 && column + 8 <= P {'
          assert text.count(old_eight) == 2, text.count(old_eight)

          f32_start = text.index('unsafe fn matmul_f32')
          f64_start = text.index('unsafe fn matmul_f64')
          f32 = text[f32_start:f64_start]
          f64 = text[f64_start:]

          f32 = f32.replace(
              old_eight,
              'while M % 16 != 0 && P >= 8 && P % 8 <= 2 && column + 8 <= P {',
              1,
          )

          four_start = f32.index('while column + 4 <= P {')
          row8 = f32.index('        while row + 8 <= M {', four_start)
          block16 = '''        while row + 16 <= M {
              let mut accumulator00 = _mm256_setzero_ps();
              let mut accumulator01 = _mm256_setzero_ps();
              let mut accumulator02 = _mm256_setzero_ps();
              let mut accumulator03 = _mm256_setzero_ps();
              let mut accumulator10 = _mm256_setzero_ps();
              let mut accumulator11 = _mm256_setzero_ps();
              let mut accumulator12 = _mm256_setzero_ps();
              let mut accumulator13 = _mm256_setzero_ps();
              for shared in 0..N {
                  let lhs_packet0 = _mm256_loadu_ps(lhs_values.as_ptr().add(shared * M + row));
                  let lhs_packet1 =
                      _mm256_loadu_ps(lhs_values.as_ptr().add(shared * M + row + 8));
                  let rhs0 = _mm256_set1_ps(*rhs_values.as_ptr().add(column * N + shared));
                  let rhs1 =
                      _mm256_set1_ps(*rhs_values.as_ptr().add((column + 1) * N + shared));
                  let rhs2 =
                      _mm256_set1_ps(*rhs_values.as_ptr().add((column + 2) * N + shared));
                  let rhs3 =
                      _mm256_set1_ps(*rhs_values.as_ptr().add((column + 3) * N + shared));
                  accumulator00 = _mm256_fmadd_ps(lhs_packet0, rhs0, accumulator00);
                  accumulator01 = _mm256_fmadd_ps(lhs_packet0, rhs1, accumulator01);
                  accumulator02 = _mm256_fmadd_ps(lhs_packet0, rhs2, accumulator02);
                  accumulator03 = _mm256_fmadd_ps(lhs_packet0, rhs3, accumulator03);
                  accumulator10 = _mm256_fmadd_ps(lhs_packet1, rhs0, accumulator10);
                  accumulator11 = _mm256_fmadd_ps(lhs_packet1, rhs1, accumulator11);
                  accumulator12 = _mm256_fmadd_ps(lhs_packet1, rhs2, accumulator12);
                  accumulator13 = _mm256_fmadd_ps(lhs_packet1, rhs3, accumulator13);
              }
              _mm256_storeu_ps(
                  output_values.as_mut_ptr().add(column * M + row),
                  accumulator00,
              );
              _mm256_storeu_ps(
                  output_values.as_mut_ptr().add((column + 1) * M + row),
                  accumulator01,
              );
              _mm256_storeu_ps(
                  output_values.as_mut_ptr().add((column + 2) * M + row),
                  accumulator02,
              );
              _mm256_storeu_ps(
                  output_values.as_mut_ptr().add((column + 3) * M + row),
                  accumulator03,
              );
              _mm256_storeu_ps(
                  output_values.as_mut_ptr().add(column * M + row + 8),
                  accumulator10,
              );
              _mm256_storeu_ps(
                  output_values.as_mut_ptr().add((column + 1) * M + row + 8),
                  accumulator11,
              );
              _mm256_storeu_ps(
                  output_values.as_mut_ptr().add((column + 2) * M + row + 8),
                  accumulator12,
              );
              _mm256_storeu_ps(
                  output_values.as_mut_ptr().add((column + 3) * M + row + 8),
                  accumulator13,
              );
              row += 16;
          }
          '''
          f32 = f32[:row8] + block16 + f32[row8:]

          eight_start = f64.index('    ' + old_eight)
          four_start64 = f64.index('    while column + 4 <= P {', eight_start)
          f64 = f64[:eight_start] + f64[four_start64:]

          path.write_text(text[:f32_start] + f32 + f64)
          PY

          cargo fmt -- src/kernels/x86/avx2_fma.rs
      - name: Validate candidate
        env:
          RUSTFLAGS: -C target-cpu=native
        run: |
          cargo test --lib
          cargo clippy --lib -- -D warnings
          cargo check --no-default-features
          git diff --check
      - name: Commit production change and remove helper
        run: |
          git config user.name "Yongkyun Shin"
          git config user.email "yongkyuns@gmail.com"
          git rm .github/workflows/apply-avx2-matmul-policy.yml
          git add src/kernels/x86/avx2_fma.rs
          git commit -m "Optimize AVX2 matmul blocking policy"
          git push origin HEAD:agent/avx2-matmul-blocking
