[package]
name = "stack-algebra"
authors = ["Yongkyun Shin <yongkyuns@gmail.com>"]
description = "Stack-allocated lightweight algebra for bare-metal rust"
repository = "https://github.com/yongkyuns/stack-algebra"
documentation = "https://docs.rs/stack-algebra"
readme = "README.md"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
categories = ["mathematics", "science", "no-std"]
keywords = ["robotics", "math", "matrix", "vector", "linear-algebra"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
eigen-compare = []

[dependencies]
approx = "0.5"
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
vectrix-macro = { version = "0.3.0"}
stride = { version = "0.3.0"}

[dev-dependencies]
criterion = "0.8"
dyn-stack = "0.13"
faer = "0.24"
faer-traits = "0.24"

[build-dependencies]
cc = "1.4"

[[bench]]
name = "fixed_size"
harness = false

[[bench]]
name = "robotics"
harness = false

[[bench]]
name = "sparse"
harness = false

[[bench]]
name = "block_sparse"
harness = false

[[bench]]
name = "dense_solvers"
harness = false
