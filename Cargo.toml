[package]
name = "stack-algebra"
authors = ["Yongkyun Shin <yongkyuns@gmail.com>"]
description = "Inline-storage linear algebra for no_std and embedded Rust"
repository = "https://github.com/yongkyuns/stack-algebra"
homepage = "https://yongkyuns.github.io/stack-algebra/"
documentation = "https://docs.rs/stack-algebra"
readme = "README.md"
version = "0.3.0-alpha.1"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
categories = ["mathematics", "science", "no-std"]
keywords = ["robotics", "math", "matrix", "vector", "linear-algebra"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
std = ["num-traits/std"]
eigen-compare = []

[dependencies]
approx = "0.5"
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
vectrix-macro = { version = "0.3.0"}
stride = { version = "0.3.0"}

[dev-dependencies]
criterion = "0.8"
dyn-stack = "0.13"
faer = "0.24"
faer-traits = "0.24"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }

[build-dependencies]
cc = "1.4"

[[bench]]
name = "fixed_size"
harness = false

[[bench]]
name = "small_fixed"
harness = false

[[bench]]
name = "sparse"
harness = false

[[bench]]
name = "block_sparse"
harness = false

[[bench]]
name = "dense_solvers"
harness = false

[[bench]]
name = "comparison"
harness = false

[[bench]]
name = "fused"
harness = false

[[bench]]
name = "dense_multi_rhs"
harness = false
