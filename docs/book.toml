[book]
title = "stack-algebra"
description = "Fixed-size, no_std Rust linear algebra for predictable-memory systems."
authors = ["stack-algebra contributors"]
language = "en"
src = "."

[build]
build-dir = "../build/book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/yongkyuns/stack-algebra"
additional-css = ["theme/custom.css"]
