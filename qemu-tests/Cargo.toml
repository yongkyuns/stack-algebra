[package]
name = "stack-algebra-qemu-tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]
cortex-m = ["dep:cortex-m", "dep:cortex-m-rt", "dep:cortex-m-semihosting"]
riscv32 = ["dep:riscv-rt"]
aarch64 = []
resource-baseline = []
resource-dense3 = []
resource-dense6 = []
resource-dense6-f64 = []
resource-dense15 = []
resource-sparse = []
resource-block-sparse = []

[dependencies]
stack-algebra = { path = ".." }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { version = "0.7", optional = true }
cortex-m-rt = { version = "0.7", optional = true, features = ["paint-stack"] }
cortex-m-semihosting = { version = "0.5", optional = true }

[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv-rt = { version = "0.18", optional = true }

[[bin]]
name = "cortex-m"
path = "src/bin/cortex_m.rs"
required-features = ["cortex-m"]

[[bin]]
name = "cortex-m-resource"
path = "src/bin/cortex_m_resource.rs"
required-features = ["cortex-m"]

[[bin]]
name = "cortex-m-bench"
path = "src/bin/cortex_m_bench.rs"
required-features = ["cortex-m"]

[[bin]]
name = "riscv32"
path = "src/bin/riscv32.rs"
required-features = ["riscv32"]

[[bin]]
name = "aarch64"
path = "src/bin/aarch64.rs"
required-features = ["aarch64"]

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"
